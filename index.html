    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary-color: #0ea5e9;
            --secondary-color: #f5c542;
            --accent-color: #f472b6;
            --bg-primary: #08070d;
            --bg-secondary: #0e0d16;
            --bg-card: #13121e;
            --text-primary: #e8e6f0;
            --text-secondary: #8a86a0;
            --text-muted: #4e4a62;
            --border-subtle: rgba(14, 165, 233,0.08);
            --border-hover: rgba(14, 165, 233,0.18);
        }
    }

    @layer base {
        * {
            @apply border-0 box-border;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            cursor: none !important;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            @apply bg-[var(--bg-primary)] text-[var(--text-primary)] overflow-x-hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            cursor: none;
        }

        a, button, input, textarea, select {
            cursor: none;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Outfit', 'Inter', sans-serif;
            line-height: 1.2;
        }

        input, textarea, button, select {
            font-family: 'Inter', sans-serif;
        }

        ::selection {
            background: rgba(14, 165, 233, 0.25);
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(14, 165, 233,0.18);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(14, 165, 233,0.35);
        }
    }

    @layer components {
        /* ── Cursor follower ── */
        .cursor-dot {
            position: fixed;
            top: 0; left: 0;
            margin-left: -4px; margin-top: -4px;
            width: 8px; height: 8px;
            background: var(--primary-color);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transition: transform 0.08s ease-out, opacity 0.3s, background 0.3s, box-shadow 0.3s, width 0.3s, height 0.3s, margin 0.3s;
            box-shadow: 0 0 12px rgba(14, 165, 233,0.8);
            mix-blend-mode: screen;
        }
        .cursor-dot.interactive {
            background: var(--secondary-color);
            box-shadow: 0 0 15px rgba(245,197,66,0.8);
            width: 16px; height: 16px;
            margin-left: -8px; margin-top: -8px;
        }
        .cursor-ring {
            position: fixed;
            top: 0; left: 0;
            margin-left: -18px; margin-top: -18px;
            width: 36px; height: 36px;
            border: 1.5px solid rgba(14, 165, 233,0.4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99998;
            transition: transform 0.18s ease-out, width 0.3s ease-out, height 0.3s ease-out, margin 0.3s ease-out, border-color 0.3s, opacity 0.3s;
            mix-blend-mode: screen;
        }
        .cursor-ring.interactive {
            width: 60px; height: 60px;
            margin-left: -30px; margin-top: -30px;
            border-color: rgba(245,197,66,0.8);
        }
        .cursor-glow {
            position: fixed;
            top: 0; left: 0;
            margin-left: -100px; margin-top: -100px;
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(14, 165, 233,0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99997;
            transition: transform 0.3s ease-out;
        }

        /* ── Hero gradient ── */
        .animated-gradient {
            background: linear-gradient(-45deg, #0d0820, #120a1a, #0a0d1e, #100818);
            background-size: 300% 300%;
            animation: hero-gradient 20s ease infinite;
            will-change: background-position;
        }

        /* ── Background particles ── */
        .bg-particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            will-change: transform, opacity;
            animation: particle-float 30s linear infinite;
        }
        .bg-particle:nth-child(odd) {
            background: var(--primary-color);
        }
        .bg-particle:nth-child(even) {
            background: var(--secondary-color);
        }
        .bg-particle:nth-child(3n) {
            background: var(--accent-color);
        }

        /* ── Section utility ── */
        .section-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(14, 165, 233,0.15), transparent);
        }

        /* ── Reveal animations ── */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .reveal-delay-1 { transition-delay: 0.1s; }
        .reveal-delay-2 { transition-delay: 0.2s; }
        .reveal-delay-3 { transition-delay: 0.3s; }
        .reveal-delay-4 { transition-delay: 0.4s; }

        /* ── Float animation for cards ── */
        .float-subtle {
            animation: float-subtle 6s ease-in-out infinite;
        }
    }

    /* ════════════════════════════════════════
       KEYFRAMES — GPU-ACCELERATED
       ════════════════════════════════════════ */

    @keyframes hero-gradient {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    @keyframes particle-float {
        0% {
            transform: translate3d(0, 100vh, 0) scale(1) rotate(0deg);
            opacity: 0;
        }
        5% { opacity: 0.15; }
        50% {
            transform: translate3d(30px, 50vh, 0) scale(1.2) rotate(180deg);
            opacity: 0.2;
        }
        95% { opacity: 0.15; }
        100% {
            transform: translate3d(60px, -80px, 0) scale(0.5) rotate(360deg);
            opacity: 0;
        }
    }

    @keyframes orb-breathe {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50%      { opacity: 0.7; transform: scale(1.05); }
    }

    @keyframes orb-drift {
        0%   { transform: translate(0, 0); }
        25%  { transform: translate(30px, -20px); }
        50%  { transform: translate(-20px, 15px); }
        75%  { transform: translate(15px, 25px); }
        100% { transform: translate(0, 0); }
    }

    @keyframes click-ripple {
        0% {
            transform: scale(1);
            opacity: 0.6;
        }
        100% {
            transform: scale(40);
            opacity: 0;
        }
    }

    @keyframes bounce {
        0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
        40%  { transform: translateY(-8px); }
        60%  { transform: translateY(-4px); }
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.4; transform: scale(0.9); }
    }

    @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(30px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
    }

    @keyframes float-subtle {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-6px); }
    }

    @keyframes glow-pulse {
        0%, 100% { box-shadow: 0 0 20px rgba(14, 165, 233,0.15); }
        50%      { box-shadow: 0 0 40px rgba(14, 165, 233,0.3); }
    }

    @keyframes rotate-slow {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
    }

    @keyframes border-dance {
        0%   { border-color: rgba(14, 165, 233,0.3); }
        33%  { border-color: rgba(245,197,66,0.3); }
        66%  { border-color: rgba(244,114,182,0.3); }
        100% { border-color: rgba(14, 165, 233,0.3); }
    }

    @keyframes text-glow {
        0%, 100% { text-shadow: 0 0 20px rgba(14, 165, 233,0.3); }
        50%      { text-shadow: 0 0 40px rgba(14, 165, 233,0.6); }
    }

    </style>
