    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary-color: #ffffff;
            --secondary-color: #bbbbbb;
            --accent-color: #bcff00;
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-card: #151515;
            --text-primary: #f2f2f2;
            --text-secondary: #999999;
            --text-muted: #666666;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.2);
        }
    }

    @layer base {
        * {
            @apply border-0 box-border;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            @apply bg-[#0a0a0a] text-primary overflow-x-hidden;
            font-family: 'Space Grotesk', sans-serif;
            line-height: 1.7;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Noto Serif', serif;
            line-height: 1.2;
        }

        input, textarea, button, select {
            font-family: 'Space Grotesk', sans-serif;
        }

        ::selection {
            @apply bg-primary-fixed text-on-primary-fixed;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 181, 246, 0.12);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 181, 246, 0.25);
        }
    }

    @layer components {
        /* ── Hero gradient ── */
        .animated-gradient {
            background: linear-gradient(-45deg, #0d0820, #120a1a, #0a0d1e, #100818);
            background-size: 300% 300%;
            animation: hero-gradient 25s ease infinite;
            will-change: background-position;
        }

        /* ── Background particles ── */
        .bg-particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            will-change: transform, opacity;
            animation: particle-float 30s linear infinite;
        }
        .bg-particle:nth-child(odd) {
            background: var(--primary-color);
        }
        .bg-particle:nth-child(even) {
            background: var(--secondary-color);
        }
        .bg-particle:nth-child(3n) {
            background: var(--accent-color);
        }

        /* ── Section utility ── */
        .section-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(100, 181, 246, 0.1), transparent);
        }

        /* ── Reveal animations ── */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .reveal-delay-1 { transition-delay: 0.1s; }
        .reveal-delay-2 { transition-delay: 0.2s; }
        .reveal-delay-3 { transition-delay: 0.3s; }
        .reveal-delay-4 { transition-delay: 0.4s; }
    }

    /* ════════════════════════════════════════
       KEYFRAMES
       ════════════════════════════════════════ */

    @keyframes hero-gradient {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    @keyframes particle-float {
        0% {
            transform: translate3d(0, 100vh, 0) scale(1);
            opacity: 0;
        }
        5% { opacity: 0.08; }
        50% {
            transform: translate3d(20px, 50vh, 0) scale(1.1);
            opacity: 0.12;
        }
        95% { opacity: 0.08; }
        100% {
            transform: translate3d(40px, -80px, 0) scale(0.6);
            opacity: 0;
        }
    }

    @keyframes orb-breathe {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50%      { opacity: 0.5; transform: scale(1.03); }
    }

    @keyframes orb-drift {
        0%   { transform: translate(0, 0); }
        25%  { transform: translate(20px, -15px); }
        50%  { transform: translate(-15px, 10px); }
        75%  { transform: translate(10px, 18px); }
        100% { transform: translate(0, 0); }
    }

    @keyframes bounce {
        0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
        40%  { transform: translateY(-6px); }
        60%  { transform: translateY(-3px); }
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.4; }
    }

    @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
    }

    </style>
